name: ToDus Caller 51417372
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run caller
        env:
          TODUS_PHONE: ${{ secrets.TODUS_PHONE }}
          TODUS_PEER: "51417372"
          RUNTIME: "120"
        run: python caller.py
